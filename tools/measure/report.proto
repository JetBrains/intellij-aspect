syntax = "proto3";

option java_outer_classname = "ReportProto";
option java_package = "com.intellij.aspect.tools.measure";

message Series {
  // per-repeat values, in run order; repeats without a value are omitted
  repeated double values = 1;

  // arithmetic mean of the values
  double avg = 2;

  // standard deviation of the values
  double std = 3;
}

message Metric {
  string name = 1;

  Series baseline = 2;
  Series aspect = 3;

  // percentage the aspect average adds over the baseline average
  double cmp = 4;
}

message Report {
  string project = 1;
  repeated string targets = 2;
  string bazel_version = 3;

  // whether only the analysis phase was executed
  bool nobuild = 4;

  repeated Metric metrics = 5;
}
