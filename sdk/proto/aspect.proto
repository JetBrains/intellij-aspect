syntax = "proto3";

option java_package = "com.google.devtools.intellij.aspect";

message Module {
  // the file that defines the module
  string file = 1;

  // rulesets the module can be applied to; if any of them is present, the module will be used
  repeated string rulesets = 2;
}

message AspectConfiguration {
  // path of the generated aspect file relative to the aspect root, e.g. `config/aspect.bzl`
  string file = 1;

  // the name of the generated aspect, defaults to `intellij_aspect`
  string name = 2;

  // the module that can be used by this aspect
  repeated Module modules = 3;
}
